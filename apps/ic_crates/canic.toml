[app]
name = "ic_crates"
init_mode = "enabled"

[auth.delegated_tokens]
enabled = false

[roles.root]
kind = "root"

[roles.registry]
kind = "canister"
package = "registry"

[roles.blob]
kind = "canister"
package = "blob"

[component_specs.registry]
component_role = "registry"
maximum_instances = 1

[component_specs.blob]
component_role = "blob"
maximum_instances = 1
application_init_required = true

[component_groups.backend.components.registry]
component_spec = "registry"

[component_groups.backend.components.blob]
component_spec = "blob"

[component_group_deployments.backend]
component_group = "backend"
initial_placements = 1
maximum_placements = 1
placement.maximum_per_root = 1
placement.minimum_distinct_roots = 1
