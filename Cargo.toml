[workspace]
members = [
    "apps/ic_crates/blob",
    "apps/ic_crates/publisher",
    "apps/ic_crates/registry",
    "apps/ic_crates/tests",
    "crates/ic-crates-protocol",
]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.91.0"
license = "MIT"
repository = "https://github.com/dragginzgame/ic-crates"

[workspace.dependencies]
candid = "0.10"
canic = { version = "0.111.0", default-features = false }
canic-blob-service = "0.111.0"
canic-host = { version = "0.111.0", default-features = false }
flate2 = "1.1"
getrandom = "0.4"
ic-agent = { version = "0.49.2", default-features = false, features = ["pem", "ring"] }
ic-blob-storage = "0.23"
ic-blob-storage-contracts = "0.23"
ic-cdk = "0.20.3"
ic-crates-protocol = { version = "0.2.1", path = "crates/ic-crates-protocol" }
ic-host-fs = "0.17"
ic-host-process = "0.17"
ic-memory = "0.36"
ic-testkit = "0.35"
# IcyDB 0.272 is retained pending Canic adoption of Timers 0.21.
# Canic 0.111 still selects Timers 0.17; runtime qualification is pending.
icydb = { version = "0.273", default-features = false }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2.6"
tar = "0.4"
tempfile = "3.27"
tiny_http = "0.12"
tokio = { version = "1.53", features = ["rt", "time", "process"] }
toml = "1.1"
url = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[profile.fast]
inherits = "release"
lto = "thin"
codegen-units = 8
